name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # A v1.2.3 tag builds version 1.2.3; other builds keep the csproj version.
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: dotnet build -c Release
      # UI tests drive a real window and need an interactive desktop.
      - name: Test
        run: dotnet test -c Release --no-build --filter "TestCategory!=UI" --logger trx --results-directory TestResults
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName -Raw
            $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $title = $_.testName -replace '%', '%25' -replace "`r?`n", ' ' -replace ':', '%3A' -replace ',', '%2C'
              $detail = "$($_.Output.ErrorInfo.Message)`n$($_.Output.ErrorInfo.StackTrace)" -replace '%', '%25' -replace "`r?`n", '%0A'
              Write-Output "::error title=${title}::$detail"
            }
          }
      - name: Package
        shell: pwsh
        run: |
          $publishArgs = @(if ($env:RELEASE_VERSION) { "-p:Version=$($env:RELEASE_VERSION.TrimStart('v'))" })
          tools\publish.bat @publishArgs
      - name: Smoke-test the packaged exe
        shell: pwsh
        run: |
          # BatchPad.exe is a GUI app, so wait for it explicitly rather than relying on the shell.
          $p = Start-Process dist\BatchPad.exe -ArgumentList --version -NoNewWindow -Wait -PassThru -RedirectStandardOutput version.txt
          $version = Get-Content version.txt -Raw
          Write-Output $version
          $expected = if ($env:RELEASE_VERSION) { [regex]::Escape($env:RELEASE_VERSION.TrimStart('v')) } else { '\S' }
          if ($p.ExitCode -ne 0 -or $version -notmatch "^BatchPad $expected") { throw "BatchPad.exe --version failed (exit $($p.ExitCode))" }
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:RELEASE_VERSION dist/BatchPad.exe --title "BatchPad $env:RELEASE_VERSION" --generate-notes --verify-tag
      - name: Upload BatchPad.exe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: BatchPad-win-x64
          path: dist/BatchPad.exe
          retention-days: 14
